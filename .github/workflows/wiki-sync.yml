name: Sync GitHub Wiki edits back into docs/

on:
  gollum:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout wiki
        run: |
          rm -rf wiki-clone
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki-clone

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci --omit=dev

      - name: Pull wiki edits into docs/
        run: node build/sync-wiki-to-docs.mjs wiki-clone

      - name: Rebuild site
        run: node build/build.mjs

      - name: Commit docs + site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs site
          git diff --cached --quiet || git commit -m "docs: sync wiki edits back into docs [skip ci]"
          git push
